<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fechamento de caixa</title>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: #fff; color: #1f1f1f; font-family: Arial, Helvetica, sans-serif; }
  .estado { text-align: center; margin-top: 22vh; font-size: 22px; color: #333; padding: 0 16px; }
  .estado small { display: block; font-size: 15px; color: #777; margin-top: 8px; }
  .wrap { display: flex; gap: 48px; justify-content: center; align-items: flex-start; padding: 28px 24px 40px; }
  .form { width: 100%; max-width: 420px; }
  h1 { font-size: 22px; margin: 0; text-align: center; }
  .cliente { text-align: center; color: #444; font-size: 15px; margin: 4px 0 0; }
  .cnpj { text-align: center; color: #555; font-size: 13px; font-weight: bold; margin: 3px 0 16px; letter-spacing: .3px; }
  label { display: block; font-size: 16px; font-weight: bold; margin: 12px 0 5px; }
  input { width: 100%; height: 54px; padding: 0 14px; font-size: 24px; font-family: inherit; color: #1f1f1f;
          background: #fff; border: 2px solid #cfcfcf; border-radius: 8px; }
  input:focus { outline: none; border-color: #1f1f1f; }
  input.valor { text-align: right; }
  .total { display: flex; justify-content: space-between; align-items: baseline; font-size: 17px;
           margin-top: 18px; padding-top: 12px; border-top: 2px solid #eee; }
  .total strong { font-size: 24px; }
  #registrar { width: 100%; height: 64px; margin-top: 16px; font-size: 22px; font-weight: bold; letter-spacing: 1px;
               color: #fff; background: #1a7f37; border: 0; border-radius: 10px; cursor: pointer; }
  #registrar:hover { background: #156b2e; }
  #registrar:disabled { opacity: .6; cursor: wait; }
  .aviso { min-height: 24px; margin-top: 12px; font-size: 15px; text-align: center; }
  .ok { color: #1a7f37; } .erro { color: #c62828; } .info { color: #8a5a00; }
  .lateral { width: 400px; flex-shrink: 0; padding-top: 52px; }
  .lateral h2 { font-size: 16px; color: #444; margin: 0 0 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: right; color: #666; font-weight: bold; padding: 8px 6px; border-bottom: 2px solid #ddd; }
  td { text-align: right; padding: 8px 6px; border-bottom: 1px solid #eee; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  td.tot { font-weight: bold; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: #f6f6f6; }
  tbody tr.novo td { background: #e6f4ea; }
  tbody tr.vazio { cursor: default; }
  tbody tr.vazio td { color: #999; text-align: left; background: none; }
  table.sem-dinheiro .col-din { display: none; }
  tfoot td { font-weight: bold; border-top: 2px solid #ddd; border-bottom: 0; }
  .dica { color: #888; font-size: 13px; margin-top: 10px; }
  @media (max-width: 920px) {
    .wrap { flex-direction: column; align-items: center; gap: 28px; }
    .lateral { width: 100%; max-width: 420px; padding-top: 0; }
  }
</style>
</head>
<body>
<div id="estado" class="estado">Carregando...</div>

<div class="wrap" id="app" hidden>
  <div class="form">
    <h1>Fechamento de caixa</h1>
    <div class="cliente" id="nome"></div>
    <div class="cnpj" id="cnpj"></div>

    <label for="data">Data</label>
    <input id="data" type="date">

    <label for="cartao">Cartão</label>
    <input id="cartao" class="valor" type="text" inputmode="numeric" autocomplete="off">

    <label for="pix">PIX</label>
    <input id="pix" class="valor" type="text" inputmode="numeric" autocomplete="off">

    <div id="blocoDinheiro">
      <label for="dinheiro">Dinheiro</label>
      <input id="dinheiro" class="valor" type="text" inputmode="numeric" autocomplete="off">
    </div>

    <div class="total"><span>Total do dia</span><strong id="total">R$ 0,00</strong></div>

    <button id="registrar" type="button">REGISTRAR</button>
    <div id="aviso" class="aviso"></div>
  </div>

  <div class="lateral">
    <h2 id="tituloTabela">Lançamentos do mês</h2>
    <table>
      <thead>
        <tr><th>Data</th><th>Cartão</th><th>PIX</th><th class="col-din">Dinheiro</th><th>Total</th></tr>
      </thead>
      <tbody id="tabela"></tbody>
      <tfoot id="rodape"></tfoot>
    </table>
    <div class="dica">Para corrigir um dia, clique nele, ajuste os valores e registre de novo.</div>
  </div>
</div>

<script>
  // Endereço do app do Google: cole aqui o endereço que termina em /exec
  var API = 'COLE_AQUI_O_ENDERECO_EXEC';

  var CODIGO = (new URLSearchParams(location.search).get('cliente') || '').trim();

  function carregar(pronto, invalido, falhou) {
    if (API.indexOf('/exec') < 0) { mostrarEstado('Página não configurada', 'Falta colar o endereço /exec na linha var API.'); return; }
    if (!CODIGO) { invalido(); return; }
    fetch(API + '?acao=dados&cliente=' + encodeURIComponent(CODIGO))
      .then(function (r) { return r.json(); })
      .then(function (r) { if (r.ok) pronto(r); else invalido(); })
      .catch(falhou);
  }

  function enviar(dados, ok, falha) {
    dados.cliente = CODIGO;
    fetch(API, { method: 'POST', body: JSON.stringify(dados) })
      .then(function (r) { return r.json(); })
      .then(function (r) { if (r.ok) ok(r.lista); else falha(r.erro); })
      .catch(function () { falha('Sem conexão. Verifique a internet e tente de novo.'); });
  }

  var CAMPOS = ['cartao', 'pix', 'dinheiro'];
  var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho',
               'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  var lista = [];
  var temDados = false;
  var atual = { nome: '', cnpj: '' };
  var usaDinheiro = true;
  var centavos = { cartao: 0, pix: 0, dinheiro: 0 };
  var numero = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  var elData = document.getElementById('data');
  var elTotal = document.getElementById('total');
  var elAviso = document.getElementById('aviso');
  var btn = document.getElementById('registrar');

  function hojeISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function dataBR(iso) { var p = iso.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function reais(v) { return 'R$ ' + numero.format(v); }
  function aviso(texto, tipo) { elAviso.textContent = texto; elAviso.className = 'aviso ' + (tipo || ''); }
  function buscarDia(iso) {
    for (var i = 0; i < lista.length; i++) if (lista[i].data === iso) return lista[i];
    return null;
  }
  function mostrarEstado(titulo, detalhe) {
    var el = document.getElementById('estado');
    el.textContent = titulo;
    if (detalhe) {
      var s = document.createElement('small');
      s.textContent = detalhe;
      el.appendChild(s);
    }
    el.hidden = false;
    document.getElementById('app').hidden = true;
  }

  // Campos de valor: digita só números e os centavos vão se ajustando (1234 -> 12,34)
  function mostrar(campo) { document.getElementById(campo).value = numero.format(centavos[campo] / 100); }
  function atualizarTotal() {
    var soma = 0;
    CAMPOS.forEach(function (c) { soma += centavos[c]; });
    elTotal.textContent = reais(soma / 100);
    return soma;
  }
  function preencher(dia) {
    CAMPOS.forEach(function (c) { centavos[c] = dia ? Math.round(dia[c] * 100) : 0; mostrar(c); });
    atualizarTotal();
  }

  CAMPOS.forEach(function (c, i) {
    var el = document.getElementById(c);
    el.addEventListener('input', function () {
      var digitos = el.value.replace(/\D/g, '').slice(0, 11);
      centavos[c] = digitos ? parseInt(digitos, 10) : 0;
      mostrar(c);
      el.setSelectionRange(el.value.length, el.value.length);
      atualizarTotal();
    });
    el.addEventListener('focus', function () {
      setTimeout(function () { el.setSelectionRange(el.value.length, el.value.length); }, 0);
    });
    el.addEventListener('keydown', function (ev) {
      if (/^[0-9]$/.test(ev.key) && !ev.ctrlKey && !ev.metaKey) {
        ev.preventDefault();
        if (String(centavos[c]).length < 11) centavos[c] = centavos[c] * 10 + Number(ev.key);
        mostrar(c);
        atualizarTotal();
      } else if (ev.key === 'Backspace') {
        ev.preventDefault();
        centavos[c] = Math.floor(centavos[c] / 10);
        mostrar(c);
        atualizarTotal();
      } else if (ev.key === 'Delete') {
        ev.preventDefault();
        centavos[c] = 0;
        mostrar(c);
        atualizarTotal();
      } else if (ev.key === 'Enter') {
        ev.preventDefault();
        var prox = CAMPOS.slice(i + 1).filter(function (x) { return x !== 'dinheiro' || usaDinheiro; })[0];
        if (prox) document.getElementById(prox).focus();
        else btn.focus();
      }
    });
  });

  elData.addEventListener('change', function () {
    if (buscarDia(elData.value)) {
      aviso('Esse dia já foi registrado. Se registrar de novo, os valores serão substituídos.', 'info');
    } else {
      aviso('');
    }
  });
  elData.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') { ev.preventDefault(); document.getElementById('cartao').focus(); }
  });

  // Tabela lateral: só os lançamentos do mês atual
  function celula(tr, texto, classe) {
    var td = document.createElement('td');
    td.textContent = texto;
    if (classe) td.className = classe;
    tr.appendChild(td);
  }

  function desenharTabela(destaque) {
    var hoje = hojeISO();
    var mes = hoje.slice(0, 7);
    document.getElementById('tituloTabela').textContent =
      'Lançamentos de ' + MESES[Number(hoje.slice(5, 7)) - 1];

    var doMes = lista.filter(function (d) { return d.data.slice(0, 7) === mes; });
    var tbody = document.getElementById('tabela');
    var tfoot = document.getElementById('rodape');
    tbody.innerHTML = '';
    tfoot.innerHTML = '';

    if (!doMes.length) {
      var vazio = document.createElement('tr');
      vazio.className = 'vazio';
      var td = document.createElement('td');
      td.colSpan = 5;
      td.textContent = temDados ? 'Nenhum dia registrado neste mês.' : 'Carregando...';
      vazio.appendChild(td);
      tbody.appendChild(vazio);
      return;
    }

    var soma = { cartao: 0, pix: 0, dinheiro: 0 };
    doMes.forEach(function (dia) {
      var tr = document.createElement('tr');
      if (dia.data === destaque) tr.className = 'novo';
      var total = dia.cartao + dia.pix + dia.dinheiro;
      CAMPOS.forEach(function (c) { soma[c] += dia[c]; });
      celula(tr, dataBR(dia.data));
      celula(tr, numero.format(dia.cartao));
      celula(tr, numero.format(dia.pix));
      celula(tr, numero.format(dia.dinheiro), 'col-din');
      celula(tr, numero.format(total), 'tot');
      tr.addEventListener('click', function () {
        elData.value = dia.data;
        preencher(dia);
        aviso('Corrigindo ' + dataBR(dia.data) + '. Ajuste os valores e clique em REGISTRAR.', 'info');
        document.getElementById('cartao').focus();
      });
      tbody.appendChild(tr);
    });

    var rodape = document.createElement('tr');
    celula(rodape, 'Total do mês');
    celula(rodape, numero.format(soma.cartao));
    celula(rodape, numero.format(soma.pix));
    celula(rodape, numero.format(soma.dinheiro), 'col-din');
    celula(rodape, numero.format(soma.cartao + soma.pix + soma.dinheiro));
    tfoot.appendChild(rodape);
  }

  btn.addEventListener('click', function () {
    var data = elData.value;
    if (!data) { aviso('Informe a data.', 'erro'); elData.focus(); return; }
    if (data > hojeISO()) { aviso('A data não pode ser depois de hoje.', 'erro'); return; }

    var soma = atualizarTotal();
    if (soma === 0 && !confirm('Registrar ' + dataBR(data) + ' sem movimento (R$ 0,00)?')) return;
    if (buscarDia(data) && !confirm('O dia ' + dataBR(data) + ' já foi registrado. Substituir pelos valores novos?')) return;

    var dados = { data: data };
    CAMPOS.forEach(function (c) { dados[c] = centavos[c] / 100; });

    btn.disabled = true;
    btn.textContent = 'REGISTRANDO...';
    aviso('');

    enviar(dados, function (novaLista) {
      lista = novaLista || [];
      temDados = true;
      salvarCache({ nome: atual.nome, cnpj: atual.cnpj, dinheiro: usaDinheiro, lista: lista });
      desenharTabela(data);
      aviso('✓ Faturamento de ' + dataBR(data) + ' registrado: ' + reais(soma / 100), 'ok');
      elData.value = hojeISO();
      preencher(null);
      btn.disabled = false;
      btn.textContent = 'REGISTRAR';
    }, function (mensagem) {
      aviso(mensagem || 'Não foi possível registrar. Tente de novo.', 'erro');
      btn.disabled = false;
      btn.textContent = 'REGISTRAR';
    });
  });

  // Memória do navegador: na próxima abertura a tela já aparece com nome, CNPJ e tabela
  var CHAVE_CACHE = 'caixa:' + CODIGO;
  function lerCache() {
    try { var t = localStorage.getItem(CHAVE_CACHE); return t ? JSON.parse(t) : null; } catch (e) { return null; }
  }
  function salvarCache(d) {
    try { localStorage.setItem(CHAVE_CACHE, JSON.stringify({ nome: d.nome, cnpj: d.cnpj, dinheiro: d.dinheiro, lista: d.lista })); } catch (e) {}
  }
  function apagarCache() {
    try { localStorage.removeItem(CHAVE_CACHE); } catch (e) {}
  }

  // Clientes sem o campo Dinheiro: some o campo e a coluna, e o valor fica sempre zero
  function definirDinheiro(sim) {
    usaDinheiro = sim;
    document.getElementById('blocoDinheiro').hidden = !sim;
    document.querySelector('table').classList.toggle('sem-dinheiro', !sim);
    if (!sim) { centavos.dinheiro = 0; mostrar('dinheiro'); atualizarTotal(); }
  }

  function aplicarDados(dados) {
    lista = dados.lista || [];
    temDados = true;
    atual = { nome: dados.nome || '', cnpj: dados.cnpj || '' };
    document.getElementById('nome').textContent = atual.nome;
    document.getElementById('cnpj').textContent = atual.cnpj ? 'CNPJ ' + atual.cnpj : '';
    definirDinheiro(dados.dinheiro !== false);
    desenharTabela(null);
    if (!elAviso.textContent && buscarDia(elData.value)) {
      aviso('Hoje já foi registrado. Se registrar de novo, os valores serão substituídos.', 'info');
    }
  }

  // A tela abre na hora; os dados atualizados chegam logo depois, sem apagar o que já foi digitado
  document.getElementById('estado').hidden = true;
  document.getElementById('app').hidden = false;
  elData.value = hojeISO();
  elData.max = hojeISO();
  preencher(null);
  var guardado = lerCache();
  if (guardado) aplicarDados(guardado);
  else { document.getElementById('nome').textContent = 'Carregando...'; desenharTabela(null); }
  document.getElementById('cartao').focus();

  carregar(
    function (dados) { aplicarDados(dados); salvarCache(dados); },
    function () { apagarCache(); mostrarEstado('Link inválido', 'Fale com o NOTA 360 para receber o link correto.'); },
    function () {
      if (guardado) aviso('Sem conexão no momento. Verifique a internet antes de registrar.', 'erro');
      else mostrarEstado('Não foi possível carregar', 'Verifique a internet e recarregue a página (F5).');
    }
  );
</script>
</body>
</html>
